title: GPH slides
author: Geostatistics for Population Health
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  shortcodes:
    - qr.lua
  formats:
    revealjs:
      theme: [gph.scss]
      template-partials:
        - title-slide.html
      filters:
        - gph.lua
      highlight-style: gph.theme
      width: 1280
      height: 720
      margin: 0.04
      center: false
      slide-number: c/t
      show-slide-number: all
      hash-type: number
      transition: fade
      transition-speed: fast
      background-transition: fade
      controls: true
      controls-tutorial: false
      progress: true
      menu: false
      preview-links: auto
      fig-width: 11
      fig-height: 5.2
      fig-align: center
      fig-dpi: 150
      code-line-numbers: false
      date-format: "D MMMM YYYY"
      pdf-separate-fragments: false
